#Tmux Appearance 

#      General
#-----------------------
set -g status-position bottom
set -g status-interval 5

#-----------------------




#       Color
#-----------------------
 #Base
set -g status-style "fg=white,bg=default"

#-----------------------





#        Left
#-----------------------
set -g status-left-length 60
set -g status-left "| #{user} | #(~/projects/nixos-config/home/tmux/scripts/path.sh '#{pane_current_path}') | "

#-----------------------


#       Center
#-----------------------
 #24-hour clock: hour:minute day-month-year
set -g status-right-length 150

set -g status-right "%H:%M %d-%m-%Y | #(~/.config/tmux/scripts/language.sh '#{pane_current_command}') #(~/.config/tmux/scripts/hostname.sh)| CPU: #(~/.config/tmux/scripts/cpu.sh) | RAM: #(~/.config/tmux/scripts/ram.sh) | BAT: #(~/.config/tmux/scripts/battery.sh)"

#-----------------------


#       Right
#-----------------------

#-----------------------


#       Windows
#-----------------------
 #Inactive Windows
set -g window-status-format " #I:#W "
 
 #Active Windows
set -g window-status-current-format "#[fg=black,bg=white,bold][ #I:#W ] #[default]"

set -g window-status-separator " "

#-----------------------





#       Panes
#-----------------------
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=white"

#----------------------




#      Messages
#----------------------
set -g message-style "fg=white,bg=default"
